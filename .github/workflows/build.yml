name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create fresh React Native project
        run: npx --yes @react-native-community/cli@latest init ScholinMobile --pm npm --skip-git-init

      - name: Copy test kit into project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cp App.tsx ScholinMobile/App.tsx
          cp -r src ScholinMobile/src
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > ScholinMobile/android/app/google-services.json
          else
            cp google-services.json ScholinMobile/android/app/google-services.json
          fi

      - name: Apply branding
        working-directory: ScholinMobile/android/app/src/main/res
        run: |
          rm -f mipmap-*/ic_launcher*.webp mipmap-*/ic_launcher*.png
          rm -rf mipmap-anydpi*
          cp -r "$GITHUB_WORKSPACE"/branding/res/* .
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Scholin</string>#' values/strings.xml
          sed -i '/<style name="AppTheme"/a\        <item name="android:windowBackground">@color/splash_background</item>\n        <item name="android:windowSplashScreenBackground">@color/splash_background</item>\n        <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>\n        <item name="android:windowSplashScreenAnimationDuration">0</item>' values/styles.xml

      - name: Install libraries
        working-directory: ScholinMobile
        run: |
          npm install react-native-vision-camera@4
          npm install react-native-geolocation-service
          npm install @react-native-firebase/app @react-native-firebase/messaging
          npm install react-native-html-to-pdf react-native-share
          npm install @react-navigation/native @react-navigation/native-stack
          npm install react-native-screens react-native-safe-area-context
          npm install @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill
          npm install lucide-react-native react-native-svg
          npm install react-native-image-picker @react-native-community/datetimepicker react-native-webview react-native-blob-util react-native-qrcode-svg qrcode @react-native-community/netinfo
          npm install @expo-google-fonts/inter @expo-google-fonts/lora

      - name: Install ads library (only when ENABLE_ADS is true)
        if: ${{ vars.ENABLE_ADS == 'true' }}
        working-directory: ScholinMobile
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          npm install react-native-google-mobile-ads
          python3 - <<'PYEOF'
          import json, os
          p = 'app.json'
          d = json.load(open(p))
          d['react-native-google-mobile-ads'] = {'android_app_id': os.environ.get('ADMOB_APP_ID') or 'ca-app-pub-3940256099942544~3347511713'}
          json.dump(d, open(p, 'w'), indent=2)
          PYEOF
          printf "export const AdsModule: any = require('react-native-google-mobile-ads');\n" > src/lib/adsNative.ts

      - name: Bundle fonts
        working-directory: ScholinMobile
        run: |
          mkdir -p android/app/src/main/assets/fonts
          for f in Inter_400Regular Inter_500Medium Inter_600SemiBold Inter_700Bold Lora_600SemiBold Lora_700Bold; do
            find node_modules/@expo-google-fonts -name "$f.ttf" -exec cp {} android/app/src/main/assets/fonts/ \;
          done
          ls android/app/src/main/assets/fonts

      - name: Add permissions and Firebase plugin
        working-directory: ScholinMobile/android
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' app/src/main/AndroidManifest.xml
          sed -i '/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")/a\        classpath("com.google.gms:google-services:4.4.2")' build.gradle
          printf "\napply plugin: 'com.google.gms.google-services'\n" >> app/build.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' build.gradle
          python3 - <<'PYEOF'
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = """<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="scholin" />
                </intent-filter>
              </activity>"""
          s = s.replace('</activity>', f, 1)
          # Small white icon shown in the status bar for notifications (instead of a grey square).
          import re
          if 'default_notification_icon' not in s:
              s = re.sub(r'(<application[^>]*>)', r'\1\n      <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_scholin" />', s, count=1)
          open(p, 'w').write(s)

          # Create the notification channels at startup. High importance is what lets a notification
          # appear in the status bar and pop up on screen. FCM uses fcm_fallback_notification_channel
          # when the server does not name a channel, so that one is created as high importance too.
          import glob
          for kt in glob.glob('app/src/main/java/**/MainApplication.kt', recursive=True):
              k = open(kt).read()
              if 'scholin_default' not in k:
                  channel_lines = [
                      'super.onCreate()',
                      '    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {',
                      '      val nm = getSystemService(android.content.Context.NOTIFICATION_SERVICE) as android.app.NotificationManager',
                      '      for (id in listOf("scholin_default", "fcm_fallback_notification_channel")) {',
                      '        val ch = android.app.NotificationChannel(id, "Scholin notifications", android.app.NotificationManager.IMPORTANCE_HIGH)',
                      '        ch.description = "Announcements, fees and school updates"',
                      '        nm.createNotificationChannel(ch)',
                      '      }',
                      '    }',
                  ]
                  channel_code = chr(10).join(channel_lines)
                  k = k.replace('super.onCreate()', channel_code, 1)
                  open(kt, 'w').write(k)
          PYEOF

      - name: Build APK
        working-directory: ScholinMobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: scholin-test-apk
          path: ScholinMobile/android/app/build/outputs/apk/release/app-release.apk
