name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create fresh React Native project
        run: npx --yes @react-native-community/cli@latest init ScholinMobile --pm npm --skip-git-init

      - name: Copy test kit into project
        run: |
          cp App.tsx ScholinMobile/App.tsx
          cp -r src ScholinMobile/src
          cp google-services.json ScholinMobile/android/app/google-services.json

      - name: Apply branding
        working-directory: ScholinMobile/android/app/src/main/res
        run: |
          rm -f mipmap-*/ic_launcher*.webp mipmap-*/ic_launcher*.png
          rm -rf mipmap-anydpi*
          cp -r "$GITHUB_WORKSPACE"/branding/res/* .
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Scholin</string>#' values/strings.xml
          sed -i '/<style name="AppTheme"/a\        <item name="android:windowBackground">@drawable/splash_background</item>\n        <item name="android:windowSplashScreenBackground">@color/splash_background</item>\n        <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>' values/styles.xml

      - name: Install libraries
        working-directory: ScholinMobile
        run: |
          npm install react-native-vision-camera@4
          npm install react-native-geolocation-service
          npm install @react-native-firebase/app @react-native-firebase/messaging
          npm install react-native-html-to-pdf react-native-share
          npm install @react-navigation/native @react-navigation/native-stack
          npm install react-native-screens react-native-safe-area-context
          npm install @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill
          npm install lucide-react-native react-native-svg
          npm install @expo-google-fonts/inter @expo-google-fonts/lora

      - name: Bundle fonts
        working-directory: ScholinMobile
        run: |
          mkdir -p android/app/src/main/assets/fonts
          for f in Inter_400Regular Inter_500Medium Inter_600SemiBold Inter_700Bold Lora_600SemiBold Lora_700Bold; do
            find node_modules/@expo-google-fonts -name "$f.ttf" -exec cp {} android/app/src/main/assets/fonts/ \;
          done
          ls android/app/src/main/assets/fonts

      - name: Add permissions and Firebase plugin
        working-directory: ScholinMobile/android
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' app/src/main/AndroidManifest.xml
          sed -i '/classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")/a\        classpath("com.google.gms:google-services:4.4.2")' build.gradle
          printf "\napply plugin: 'com.google.gms.google-services'\n" >> app/build.gradle
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' build.gradle

      - name: Build APK
        working-directory: ScholinMobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: scholin-test-apk
          path: ScholinMobile/android/app/build/outputs/apk/release/app-release.apk
